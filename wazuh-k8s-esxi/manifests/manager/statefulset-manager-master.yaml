apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-master
  namespace: __NAMESPACE__
  labels:
    app: wazuh-manager
    node-type: master
spec:
  serviceName: wazuh-cluster
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: master
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: master
    spec:
      nodeSelector:
        wazuh.role: general
      # master → worker-01 через PV nodeAffinity; anti-affinity на всякий случай
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: wazuh-manager
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: wazuh-conf
          configMap:
            name: wazuh-conf
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:__WAZUH_VERSION__
          ports:
            - containerPort: 1514
              name: events
            - containerPort: 1515
              name: enrollment
            - containerPort: 55000
              name: api
            - containerPort: 1516
              name: cluster
          env:
            # Образ читает именно WAZUH_CLUSTER_KEY и подставляет в ossec.conf
            # (placeholder to_be_replaced_by_cluster_key). См. docs/cluster-assembly.md
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-credentials
                  key: cluster-key
            - name: INDEXER_URL
              value: https://wazuh-indexer:9200
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: full
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-credentials
                  key: indexer-user
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-credentials
                  key: indexer-password
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-credentials
                  key: api-user
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-credentials
                  key: api-password
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            # ossec.conf с блоком <cluster> (master) — без этого кластер Manager не соберётся
            - name: wazuh-conf
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: master.conf
              readOnly: true
            - name: manager-data
              mountPath: /var/ossec/data
            - name: manager-etc
              mountPath: /var/ossec/etc
          readinessProbe:
            tcpSocket:
              port: 55000
            initialDelaySeconds: 45
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: manager-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: wazuh-general
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: manager-etc
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: wazuh-general
        resources:
          requests:
            storage: 10Gi
