# Lab/fallback PVs for Manager when vSphere CSI is not yet available.
# Prefer a real CSI StorageClass named wazuh-general in production (edit StorageClass provisioner).
# EDIT node names to match workers with wazuh.role=general.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wazuh-manager-master-data-pv
spec:
  capacity:
    storage: 50Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: wazuh-general
  local:
    path: /var/lib/wazuh-manager/master-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker-01"]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wazuh-manager-master-etc-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: wazuh-general
  local:
    path: /var/lib/wazuh-manager/master-etc
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker-01"]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wazuh-manager-worker-data-pv
spec:
  capacity:
    storage: 50Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: wazuh-general
  local:
    path: /var/lib/wazuh-manager/worker-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker-02"]
